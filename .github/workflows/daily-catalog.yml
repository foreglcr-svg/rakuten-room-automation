name: Daily ROOM Catalog

on:
  schedule:
    # 毎日 20:00 JST (11:00 UTC) に起動 — GitHubの実行遅延(30〜90分)を見込み、
    # ROOMのゴールデンタイム(20〜22時)の頭にメールが届くようにする
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate catalog
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          # GEMINI_API_KEY が正式名。別名で登録されていても拾えるようフォールバック
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python app.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_items.json
          [ -f CATALOG.md ] && git add CATALOG.md || true
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "Update ROOM catalog ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            # 実行中にmainが進んでいてもpushが失敗しないよう、リベースして再試行
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push失敗。最新を取り込んで再試行します ($attempt/3)"
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi

      # Issueを作成すると@メンション通知メールが届く(本文に紹介文入りカタログを丸ごと掲載)
      - name: Email notification via issue
        if: hashFiles('CATALOG.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 前日までのカタログIssueは自動クローズして受信箱を汚さない
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title ROOMカタログ" --json number --jq '.[].number' \
            | xargs -r -I{} gh issue close {} --repo "$GITHUB_REPOSITORY" || true

          {
            echo "@${GITHUB_REPOSITORY_OWNER} 今日のカタログが完成しました📲"
            echo
            echo "このメール(Issue)内で完結できます: **① 紹介文をコピー → ② リンクを開く → ③ 「ROOMに投稿する」で貼り付け**"
            echo
            cat CATALOG.md
          } > /tmp/issue_body.md

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "📲 今日のROOMカタログ ($(TZ=Asia/Tokyo date +%-m/%-d))" \
            --body-file /tmp/issue_body.md
