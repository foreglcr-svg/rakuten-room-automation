name: Daily ROOM Catalog

on:
  schedule:
    # 毎日 20:00 JST (11:00 UTC) に起動 — GitHubの実行遅延(30〜90分)を見込み、
    # ROOMのゴールデンタイム(20〜22時)の頭にメールが届くようにする
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate catalog
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          # GEMINI_API_KEY が正式名。別名で登録されていても拾えるようフォールバック
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python app.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_items.json
          [ -f CATALOG.md ] && git add CATALOG.md || true
          [ -f docs/index.html ] && git add docs/index.html || true
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "Update ROOM catalog ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            # 実行中にmainが進んでいてもpushが失敗しないよう、リベースして再試行
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push失敗。最新を取り込んで再試行します ($attempt/3)"
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi

      # 1つの固定Issueを使い回し、毎日カタログをコメント追記する。
      # Issueを閉じないので「クローズ通知メール」は発生しない。届くのはカタログ通知だけ。
      - name: Email notification via issue comment
        if: hashFiles('CATALOG.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "📲 ROOMカタログ（毎日更新）"
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${OWNER}.github.io/${REPO}/"
          {
            echo "@${GITHUB_REPOSITORY_OWNER} 今日のカタログが届きました📲（$(TZ=Asia/Tokyo date +%-m/%-d)）"
            echo
            echo "▼ スマホはこちらが速いです(1タップでコピー＆アプリで開く)"
            echo "$PAGES_URL"
            echo
            echo "使い方: ① 紹介文をコピー → ② 商品ページを開く → ③ 共有から「ROOMに投稿」で貼り付け"
            echo "※ページはSafari/Chromeで開いてください(アプリ内ブラウザだと楽天アプリが起動しません)"
            echo
            echo "---"
            echo
            cat CATALOG.md
          } > /tmp/issue_body.md

          # 固定タイトルの常設Issueを探す(タイトル完全一致)
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq "[.[] | select(.title==\"$TITLE\")][0].number // empty")

          if [ -z "$NUM" ]; then
            # 初回だけ作成(以降はこのIssueを使い回す)
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/issue_body.md
          else
            # 前回までのbotコメントを削除して最新カタログだけ残す(削除は通知されない)
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUM/comments" --paginate \
              --jq '.[] | select(.user.login=="github-actions[bot]") | .id' \
              | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/{}" || true
            # 新しいカタログをコメント投稿(@メンションでメール通知)
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue_body.md
          fi
